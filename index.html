<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ann Naser Nabil</title>
    <meta property="og:title" content="Ann Naser Nabil" />
    <meta property="og:description" content="Retro UNIX Web OS — Ann Naser Nabil's personal workstation" />
    <meta property="og:image" content="https://nabil0x.github.io/retro_site/og-image.png" />
    <meta property="og:url" content="https://nabil0x.github.io/retro_site/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/retro_site/fonts/VT323-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/retro_site/fonts/IBMPlexMono-latin-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/retro_site/fonts/IBMPlexMono-latin-700.woff2" />
    <script>
      try {
        var raw = localStorage.getItem('nabilos-system');
        if (raw) {
          var t = JSON.parse(raw);
          if (t && t.state && t.state.theme) {
            document.documentElement.dataset.theme = t.state.theme;
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
